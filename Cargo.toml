[package]
name = "lua-doc-extractor"
version = "4.2.1"
edition = "2024"
# `if let ... && let ...` chains.
rust-version = "1.88"
description = "Extracts EmmyLua docs from C-style comments."
license = "MIT"
repository = "https://github.com/rhys-vdw/lua-doc-extractor-rs"
readme = "README.md"
keywords = ["lua", "emmylua", "documentation", "annotations", "cpp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "lua_doc_extractor"

[[bin]]
name = "lua-doc-extractor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
emmylua_parser = "=0.29.1"
fancy-regex = "0.19.2"
glob = "0.3.4"
rowan = "0.17"
serde_json = "1.0.154"

[dev-dependencies]
emmylua_doc_cli = "=0.25.1"
insta = "1.49.0"
tempfile = "3.27.0"

# Clippy's default lints, as warnings. Tighten here (e.g. `pedantic`).
[lints.clippy]
all = { level = "warn", priority = -1 }
