# Bumps the version, commits, tags and starts the release (Actions > Bump version > Run workflow).
# It runs `cargo release`, configured in release.toml, as you could locally.
#
# A tag pushed with the workflow's token doesn't trigger other workflows, so this starts
# release.yml on the new tag itself. That run is the same as pushing the tag by hand.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the commit and tag
      actions: write # start release.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release
      - name: Bump, commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo release ${{ inputs.bump }} --execute --no-confirm
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$version"
